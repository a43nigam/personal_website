</style></head><body><main><header><h1>JAZZ CHORD TONE TRAINER</h1><button class="quiet" id="settingsButton">SETTINGS</button></header><section id="settings" class="settings" hidden></section><section class="trainer"><div id="sequence" class="progression"></div><div id="modeLabel" class="mode-label">Practice Mode: Chord → Tones</div><h2 id="question">F#m7</h2><form id="quiz" hidden><input id="answerInput" placeholder="e.g. G7"><button>CHECK</button></form><div id="answer"></div><button id="reveal" class="primary">SHOW CHORD TONES</button><nav><button id="previous">← Previous</button><button id="next" class="primary">NEXT CHORD</button></nav></section><aside><span id="statistics"></span><button class="quiet" id="resetStats">RESET STATISTICS</button></aside></main><script>

  document.querySelector('header').insertAdjacentHTML('beforeend','<div class="header-tools"><button class="quiet" id="appendixButton">INDEX</button></div>');

  document.querySelector('#settings').insertAdjacentHTML('afterend','<section id="appendix" class="appendix" hidden><h2>CHORD FORM INDEX</h2><p>These are complete theoretical chord-tone formulas. Altered fifths replace the plain fifth; slash basses are outside the upper-structure formula.</p><table class="formula-table"><thead><tr><th>Type</th><th>Formula</th><th>Example</th></tr></thead><tbody id="formulaRows"></tbody></table></section>');

const ROOTS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'],CIRCLE=['C','F','Bb','Eb','Ab','Db','Gb','B','E','A','D','G'],PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11},LETTERS=['C','D','E','F','G','A','B'],MAJOR={1:0,2:2,3:4,4:5,5:7,6:9,7:11};
const CATEGORIES={Major:['maj7'],Minor:['m7','mMaj7'],Dominant:['7'],Diminished:['dim7','dim'],'Half-diminished':['m7b5'],Augmented:['aug','maj7#5','7#5'],Suspended:['sus4','7sus4','9sus4','13sus4','7sus2'],'Sixth chords':['6','m6','6/9','m6/9'],'Extended chords':['maj9','m9','9','maj11','11','m11','maj13','13','m13','mMaj9','mMaj11'],'Altered dominant':['7b9','7#9','7#11','7b13','7b5','7#5','9b5','9#5','7b9#11','7#9#11','7b9b13','7#9b13','13b9','13#9#11','7alt'],'Add chords':['add9','madd9','add11','madd11','add#11','add13'],'Slash chords':['slash']};
const BASIC=['maj7','m7','7','m7b5','dim7','6','m6','maj9','m9','9','11','m11','13','7b9','7#9','7#11','7b13','7sus4'];let state={mode:'tones',roots:[...ROOTS],qualities:[...BASIC],current:'F#m7',history:['F#m7'],index:0,revealed:false,display:'alto',circleQ:'7',circleI:0,sequence:['Dm7','G7','Cmaj7'],sequenceI:0,kind:'ii-V-I major',timer:'manual',auto:'off'};
let stats=JSON.parse(localStorage.getItem('jazz-chord-stats')||'{"practiced":0,"correct":0,"attempts":0,"total":0,"roots":{},"qualities":{}}'),started=Date.now(),timerId;
function root(s){let m=s.match(/^([A-G])(bb|##|b|#|n)?/),a=m[2]==='bb'?-2:m[2]==='b'?-1:m[2]==='##'?2:m[2]==='#'?1:0;return{name:m[1]+(a<0?'b'.repeat(-a):'#'.repeat(a)),letter:m[1],pc:(PC[m[1]]+a+12)%12}}
function iv(label){let m=label.match(/^((?:bb|##|b|#)?)(1|2|3|4|5|6|7|9|11|13)$/),d=+m[2],a=m[1]==='bb'?-2:m[1]==='b'?-1:m[1]==='##'?2:m[1]==='#'?1:0;return{label,d,semi:(MAJOR[(d-1)%7+1]+a+12)%12}}
function spell(r,d,pc){let l=LETTERS[(LETTERS.indexOf(r.letter)+d-1)%7],a=(pc-PC[l]+24)%12;if(a>6)a-=12;return l+(a<0?'b'.repeat(-a):'#'.repeat(a))}function replace(t,d,x){return [...t.filter(y=>iv(y).d!==d),x]}
function formula(s){s=s.replace(/Δ/g,'maj').replace(/Maj/g,'maj').replace(/MA/g,'maj').replace(/min/g,'m').replace(/ø/g,'m7b5').replace(/[°o]/g,'dim').replace(/^-/,'m');if(/^7alt$/i.test(s))return{t:['1','3','b7'],alt:1};let l=s.toLowerCase(),t,k='major';if(l.startsWith('mmaj')){k='minor';t=['1','b3','5','7'];s=s.slice(4)}else if(l.startsWith('m7b5')){k='minor';t=['1','b3','b5','b7'];s=s.slice(4)}else if(l.startsWith('dim7'))return{t:['1','b3','b5','bb7']};else if(l.startsWith('dim'))return{t:['1','b3','b5']};else if(l.startsWith('aug')||l.startsWith('+')){k='aug';t=['1','3','#5'];s=s.replace(/^(aug|\+)/i,'')}else if(/^m6\/9/i.test(s))return{t:['1','b3','5','6','9']};else if(/^6\/9/i.test(s))return{t:['1','3','5','6','9']};else if(/^m6/i.test(s))return{t:['1','b3','5','6']};else if(/^6/i.test(s))return{t:['1','3','5','6']};else if(l.startsWith('maj')){t=['1','3','5','7'];s=s.slice(3)}else if(l.startsWith('m')){k='minor';t=['1','b3','5'];s=s.slice(1)}else t=['1','3','5'];if(k==='major'&&/^(7|9|11|13)/.test(l))k='dominant';let sus=s.match(/sus(2|4)?/i);if(sus){t=replace(t,3,sus[1]==='2'?'2':'4');s=s.replace(/sus(2|4)?/i,'')}let ext=s.match(/(?<![b#])(13|11|9)/)?.[1];if((/7/.test(s)||ext)&&!t.some(x=>iv(x).d===7))t.push(k==='major'?'7':'b7');if(ext){if(+ext>=9)t.push('9');if(+ext>=11)t.push('11');if(+ext>=13)t.push('13')}let add=s.match(/add(#?11|13|9)/i);if(add){t=t.filter(x=>iv(x).d!==7);t.push(add[1])}for(let x of s.matchAll(/(?<!add)(bb7|b9|#9|#11|b13|#5|b5)/g)){let a=x[1];t=(a==='b5'||a==='#5')?replace(t,5,a):replace(t,iv(a).d,a)}return{t:[...new Set(t)].sort((a,b)=>iv(a).d-iv(b).d)}}
function chord(symbol){let sm=symbol.match(/^(.+?)\/([A-G](?:bb|##|b|#|n)?)$/),upper=sm?sm[1]:symbol,m=upper.match(/^([A-G](?:bb|##|b|#|n)?)(.*)$/),r=root(m[1]),f=formula(m[2]),tones=f.t.map(d=>{let z=iv(d),pc=(r.pc+z.semi)%12;return{d,pc,n:spell(r,z.d,pc)}}),bass;if(sm){let b=root(sm[2]),x=tones.find(x=>x.pc===b.pc),diff=(b.pc-r.pc+12)%12,names=['1','b9','9','#9','3','11','#11','5','b13','13','b7','7'];bass={n:b.name,text:x?x.d+' of '+upper:'non-chord bass tone / '+names[diff]+' relative to '+upper}}return{symbol,root:r,suffix:m[2],tones,bass,alt:f.alt}}
function trans(r,semitones){return root(ROOTS[(r.pc+semitones+120)%12])}function displayed(c){return state.display==='alto'?c:chord(trans(c.root,-9).name+c.suffix)}
function tonesRow(ts){return '<div class="tone-row">'+ts.map(t=>'<div><strong>'+t.n+'</strong><small>'+t.d+'</small></div>').join('')+'</div>'}function guide(ts){return ts.filter(t=>['3','b3','7','b7'].includes(t.d))}
function setStats(correct){let c=chord(state.current),q=c.suffix||'major';stats.practiced++;if(correct!==undefined){stats.attempts++;stats.total+=Date.now()-started;if(correct)stats.correct++;for(let [o,n] of [[stats.roots,c.root.name],[stats.qualities,q]]){o[n]??={a:0,m:0};o[n].a++;if(!correct)o[n].m++}}localStorage.setItem('jazz-chord-stats',JSON.stringify(stats))}
function render(){let c=chord(state.current),show=displayed(c),mode=state.mode,q=document.querySelector('#question'),label=document.querySelector('#modeLabel'),ans=document.querySelector('#answer'),reveal=document.querySelector('#reveal'),quiz=document.querySelector('#quiz'),seq=document.querySelector('#sequence');let ts=mode==='guide'?guide(show.tones):show.tones;label.textContent=mode==='interval'?'INTERVAL DRILL':mode==='guide'?'GUIDE TONES':mode==='identify'?'IDENTIFY THIS CHORD':'Practice Mode: Chord → Tones';seq.innerHTML=mode==='sequence'?state.sequence.map((x,i)=>'<span class="'+(i===state.sequenceI?'active':'')+'">'+x+'</span>').join(''):'';if(mode==='identify'){q.innerHTML=tonesRow(c.tones);quiz.hidden=false;document.querySelector('#answerInput').placeholder='e.g. G7'}else if(mode==='interval'){let d=guide(c.tones).slice(0,1);q.textContent='What is the '+d[0].d+' of '+c.symbol+'?';quiz.hidden=false;document.querySelector('#answerInput').placeholder='note name'}else{q.textContent=state.display==='both'?'Alto: '+c.symbol+' · Concert: '+show.symbol:(show.symbol);quiz.hidden=true}if(state.revealed){let text=c.alt?'<p>Core tones; possible altered tensions: b9, #9, b5/#11, #5/b13.</p>':'';if(state.display==='both')text+='<p>ALTO WRITTEN</p>'+tonesRow(mode==='guide'?guide(c.tones):c.tones)+'<p>CONCERT</p>'+tonesRow(mode==='guide'?guide(show.tones):show.tones);else text+=tonesRow(mode==='interval'?guide(show.tones).slice(0,1):ts)+(show.bass?'<p>BASS: '+show.bass.n+' — '+show.bass.text+'</p>':'');ans.innerHTML=text;reveal.hidden=true}else{ans.innerHTML='';reveal.hidden=(mode==='identify'||mode==='interval')}document.querySelector('#previous').disabled=state.index===0;document.querySelector('#statistics').textContent=stats.practiced+' chords practiced'+(stats.attempts?' · '+Math.round(stats.correct/stats.attempts*100)+'% quiz accuracy · '+Math.round(stats.total/stats.attempts/100)/10+'s average':'');schedule()}
function next(){let q=state.qualities.length?state.qualities:BASIC,rs=state.roots.length?state.roots:ROOTS,n=state.current;if(state.mode==='circle'){n=CIRCLE[state.circleI++%12]+state.circleQ}else if(state.mode==='sequence'){state.sequenceI=(state.sequenceI+1)%state.sequence.length;n=state.sequence[state.sequenceI]}else for(let i=0;i<20&&n===state.current;i++){let r=rs[Math.random()*rs.length|0],x=q[Math.random()*q.length|0];n=x==='slash'?r+'/'+['C','D','E','F','G','A','B'][Math.random()*7|0]:r+x}state.history=state.history.slice(0,state.index+1);state.history.push(n);state.index++;state.current=n;state.revealed=false;started=Date.now();render()}function previous(){if(state.index){state.current=state.history[--state.index];state.revealed=false;render()}}
function progression(kind,tonic){let t=root(tonic),r=n=>trans(t,n).name;return kind==='ii-V-i minor'?[r(2)+'m7b5',r(7)+'7b9',t.name+'mMaj7']:kind==='I-vi-ii-V'?[t.name+'maj7',r(9)+'m7',r(2)+'m7',r(7)+'7']:kind==='iii-vi-ii-V-I'?[r(4)+'m7',r(9)+'m7',r(2)+'m7',r(7)+'7',t.name+'maj7']:kind==='Rhythm changes turnaround'?[t.name+'maj7',r(9)+'7',r(2)+'m7',r(7)+'7']:[r(2)+'m7',r(7)+'7',t.name+'maj7']}
function settings(){let h='<div><label>Practice direction <select id="mode"><option value="tones">Chord → tones</option><option value="identify">Tones → identify chord</option><option value="interval">Interval drill</option><option value="guide">Guide tones</option><option value="circle">Circle of fourths</option><option value="sequence">Sequence / progression</option></select></label></div><div><label>Display <select id="display"><option value="alto">Alto written pitch</option><option value="concert">Concert pitch</option><option value="both">Both</option></select></label></div><div><label>New chord every <select id="timer"><option value="manual">manual</option><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select></label></div><div><label>Auto reveal after <select id="auto"><option value="off">off</option><option>1</option><option>2</option><option>3</option><option>5</option></select></label></div><fieldset><legend>Roots</legend><button class="small" id="allRoots">ALL ROOTS</button>'+ROOTS.map(r=>'<label class="check"><input class="root" value="'+r+'" type="checkbox" checked>'+r+'</label>').join('')+'</fieldset><fieldset><legend>Chord categories</legend><button class="small" id="allQualities">SELECT ALL</button><button class="small" id="basic">BASIC JAZZ</button>'+Object.entries(CATEGORIES).map(([c,qs])=>'<details><summary>'+c+'</summary>'+qs.map(q=>'<label class="check"><input class="quality" value="'+q+'" type="checkbox" '+(BASIC.includes(q)?'checked':'')+'>'+q+'</label>').join('')+'</details>').join('')+'</fieldset><div><label>Circle quality <input id="circleQ" value="7"></label></div><div><label>Progression <select id="kind"><option>ii-V-I major</option><option>ii-V-i minor</option><option>I-vi-ii-V</option><option>iii-vi-ii-V-I</option><option>Rhythm changes turnaround</option></select></label><button class="small" id="generate">GENERATE</button></div>';let e=document.querySelector('#settings');e.innerHTML=h;for(let id of ['mode','display','timer','auto','circleQ','kind'])e.querySelector('#'+id).value=state[id==='circleQ'?'circleQ':id]||state.kind;e.onchange=()=>{state.mode=e.querySelector('#mode').value;state.display=e.querySelector('#display').value;state.timer=e.querySelector('#timer').value;state.auto=e.querySelector('#auto').value;state.circleQ=e.querySelector('#circleQ').value;state.kind=e.querySelector('#kind').value;state.roots=[...e.querySelectorAll('.root:checked')].map(x=>x.value);state.qualities=[...e.querySelectorAll('.quality:checked')].map(x=>x.value);state.revealed=false;render()};e.querySelector('#allRoots').onclick=()=>{e.querySelectorAll('.root').forEach(x=>x.checked=true);e.onchange()};e.querySelector('#allQualities').onclick=()=>{e.querySelectorAll('.quality').forEach(x=>x.checked=true);e.onchange()};e.querySelector('#basic').onclick=()=>{e.querySelectorAll('.quality').forEach(x=>x.checked=BASIC.includes(x.value));e.onchange()};e.querySelector('#generate').onclick=()=>{state.sequence=progression(e.querySelector('#kind').value,state.roots[0]||'C');state.sequenceI=0;state.current=state.sequence[0];state.revealed=false;render()}}
