<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>
    <video id="stream" autoplay muted playsinline></video>
    <script src="stream-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        (function () {
            const hlsUrl = (window.STREAM_HLS_URL || "").trim();
            const player = document.getElementById("stream");
            let hls = null;
            let retryTimer = null;

            function destroyPlayer() {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                player.removeAttribute("src");
                player.load();
            }

            function scheduleRetry(message) {
                if (retryTimer) {
                    return;
                }

                retryTimer = window.setTimeout(function () {
                    retryTimer = null;
                    loadStream();
                }, 5000);
            }

            function loadNativeStream(url) {
                destroyPlayer();
                player.src = url;
                player.play().catch(function () {});
            }

            function loadStream() {
                if (!hlsUrl) {
                    return;
                }

                if (window.Hls && window.Hls.isSupported()) {
                    destroyPlayer();
                    hls = new window.Hls({
                        lowLatencyMode: true,
                        backBufferLength: 90
                    });

                    hls.loadSource(hlsUrl);
                    hls.attachMedia(player);

                    hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
                        player.play().catch(function () {});
                    });

                    hls.on(window.Hls.Events.ERROR, function (_, data) {
                        if (data && data.fatal) {
                            scheduleRetry();
                        }
                    });

                    return;
                }

                if (player.canPlayType("application/vnd.apple.mpegurl")) {
                    loadNativeStream(hlsUrl);
                    return;
                }
            }

            player.addEventListener("error", function () {
                scheduleRetry();
            });

            player.addEventListener("stalled", function () {
                scheduleRetry();
            });

            loadStream();
        }());
    </script>
</body>

</html>
